name: Security audit
# Weekly RustSec advisory scan of Cargo.lock (normal, build and dev
# dependencies), so new advisories surface even when no PRs are open.
# CI's `deny` job runs the same check on every PR and push to main.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories
