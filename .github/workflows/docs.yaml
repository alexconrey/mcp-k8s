name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned release with a verified checksum. This used to resolve "latest"
      # through the unauthenticated GitHub API, which failed when rate-limited
      # and ran an unverified binary in a job that can deploy Pages. To bump,
      # take the sha256 from the release asset's digest on GitHub.
      - name: Install mdBook (pinned, checksum verified)
        env:
          MDBOOK_VERSION: v0.5.4
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/mdbook.tar.gz" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/bin" mdbook
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/mdbook" --version

      - name: Build docs
        run: mdbook build docs/

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare deploy directory
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p deploy/$VERSION

          # Copy docs to versioned directory
          cp -r docs/book/* deploy/$VERSION/

          # For tags, also copy to /latest/
          if [[ "${{ steps.version.outputs.is_tag }}" == "true" ]]; then
            mkdir -p deploy/latest
            cp -r docs/book/* deploy/latest/
          fi

          # Build versions.json
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git show gh-pages:versions.json > /tmp/old_versions.json 2>/dev/null; then
            VERSIONS=$(cat /tmp/old_versions.json)
          else
            VERSIONS='[]'
          fi

          if ! echo "$VERSIONS" | jq -e ".[] | select(.version == \"$VERSION\")" > /dev/null 2>&1; then
            VERSIONS=$(echo "$VERSIONS" | jq ". + [{\"version\": \"$VERSION\", \"url\": \"/$VERSION/\"}]")
          fi

          VERSIONS=$(echo "$VERSIONS" | jq '[
            (.[] | select(.version == "latest")),
            ([.[] | select(.version != "latest")] | sort_by(.version) | reverse)[]
          ]')

          echo "$VERSIONS" > deploy/versions.json

          # Root redirect
          cat > deploy/index.html << 'REDIRECT'
          <!DOCTYPE html>
          <html>
          <head><meta http-equiv="refresh" content="0; url=latest/"></head>
          <body><a href="latest/">Redirecting to latest docs...</a></body>
          </html>
          REDIRECT

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
