name: Release
on:
  push:
    tags: ['v*']

# Each job asks for what it needs (packages: write, contents: write).
permissions:
  contents: read

jobs:
  # Refuse to publish anything unless the tag matches the versions in the repo
  # and the changelog has an entry for it, so downstream consumers that pin a
  # tag (deckwatch vendors this crate by git tag) get exactly what it says.
  verify-version:
    name: Verify tag matches Cargo.toml, Chart.yaml and CHANGELOG
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          chart=$(sed -n 's/^version: *//p' helm/mcp-k8s/Chart.yaml | head -1)
          echo "tag=$tag crate=$crate chart=$chart"
          fail=0
          if [ "$tag" != "$crate" ]; then
            echo "::error file=Cargo.toml::tag v$tag does not match Cargo.toml version $crate"; fail=1
          fi
          if [ "$tag" != "$chart" ]; then
            echo "::error file=helm/mcp-k8s/Chart.yaml::tag v$tag does not match Chart.yaml version $chart"; fail=1
          fi
          if ! grep -q "^## \[$tag\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no '## [$tag]' section in CHANGELOG.md"; fail=1
          fi
          exit $fail

  # Publish only a commit that passed CI on main. Release tags go on merge
  # commits of main, whose push-triggered CI run is checked here (waiting for it
  # if it's still going). Warn-only CI legs (deny advisories, semver) don't fail
  # the run, so they don't block a release.
  ci-passed:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          while :; do
            elapsed=$(( $(date +%s) - start ))
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then
              # The run appears seconds after the merge. If there's still none
              # after 5 minutes, the tag isn't on a commit that went through main.
              if [ "$elapsed" -ge 300 ]; then
                echo "::error::no CI run on main for $GITHUB_SHA; tag a merge commit of main"
                exit 1
              fi
            else
              read -r status conclusion url <<< "$run"
              echo "CI $status/${conclusion:-pending}: $url"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then exit 0; fi
                echo "::error::CI on $GITHUB_SHA concluded '$conclusion'; fix main and tag again"
                exit 1
              fi
            fi
            if [ "$elapsed" -ge 2700 ]; then
              echo "::error::CI on $GITHUB_SHA didn't finish within 45 minutes"
              exit 1
            fi
            sleep 30
          done

  docker:
    runs-on: ubuntu-latest
    needs: [verify-version, ci-passed]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # vX.Y.Z (immutable by convention), vX.Y (moves with patch releases) and
      # latest (the newest release). Pushes to main publish :main and :<sha>,
      # never :latest, so :latest always means a release.
      - name: Image tags
        id: tags
        run: |
          minor=$(echo "$GITHUB_REF_NAME" | sed -E 's/^(v[0-9]+\.[0-9]+)\..*/\1/')
          {
            echo "tags<<EOF"
            echo "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME"
            echo "ghcr.io/$GITHUB_REPOSITORY:$minor"
            echo "ghcr.io/$GITHUB_REPOSITORY:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  helm:
    runs-on: ubuntu-latest
    needs: [verify-version, ci-passed]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" helm/mcp-k8s/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${VERSION}/" helm/mcp-k8s/Chart.yaml
          helm package helm/mcp-k8s

      - name: Push chart to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm push mcp-k8s-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  release:
    runs-on: ubuntu-latest
    needs: [docker, helm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${TAG#v}"
          # This release's CHANGELOG section (verify-version checked it exists).
          CHANGES=$(awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }' CHANGELOG.md)
          MINOR="${TAG%.*}"

          {
            echo "${CHANGES}"
            echo ""
            echo "## Artifacts"
            echo ""
            echo "| Artifact | Location |"
            echo "|----------|----------|"
            echo "| Docker image | \`ghcr.io/${REPO}:${TAG}\` (also \`:${MINOR}\` and \`:latest\`) |"
            echo "| Helm chart | \`oci://ghcr.io/${OWNER}/charts/mcp-k8s:${VERSION}\` |"
            echo "| Documentation | https://${OWNER}.github.io/mcp-k8s/${TAG}/ |"
            echo "| Library (Cargo) | \`mcp-k8s = { git = \"https://github.com/${REPO}.git\", tag = \"${TAG}\", default-features = false }\` |"
            echo ""
            echo "## Quick Start"
            echo ""
            echo "\`\`\`bash"
            echo "# Docker"
            echo "docker run -p 8080:8080 ghcr.io/${REPO}:${TAG}"
            echo ""
            echo "# Helm"
            echo "helm install mcp-k8s oci://ghcr.io/${OWNER}/charts/mcp-k8s --version ${VERSION}"
            echo ""
            echo "# Claude Code (stdio)"
            echo "claude mcp add k8s -- /path/to/mcp-k8s"
            echo "\`\`\`"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: /tmp/release_notes.md
          generate_release_notes: true
          append_body: true
