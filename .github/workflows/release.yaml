name: Release
on:
  push:
    tags: ['v*']

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" helm/mcp-k8s/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: ${VERSION}/" helm/mcp-k8s/Chart.yaml
          helm package helm/mcp-k8s

      - name: Push chart to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm push mcp-k8s-${VERSION}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  release:
    runs-on: ubuntu-latest
    needs: [docker, helm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          TOOL_COUNT=$(grep -r '"name":' src/mcp/definitions.rs src/resources/*.rs 2>/dev/null | grep -c 'inputSchema' || echo "200+")

          {
            echo "## What's Changed"
            echo ""
            echo "${COMMITS}"
            echo ""
            echo "## Artifacts"
            echo ""
            echo "| Artifact | Location |"
            echo "|----------|----------|"
            echo "| Docker image | \`ghcr.io/${REPO}:${TAG}\` |"
            echo "| Helm chart | \`oci://ghcr.io/${OWNER}/charts/mcp-k8s:${VERSION}\` |"
            echo "| Documentation | https://${OWNER}.github.io/mcp-k8s/${TAG}/ |"
            echo ""
            echo "## Quick Start"
            echo ""
            echo "\`\`\`bash"
            echo "# Docker"
            echo "docker run -p 8080:8080 ghcr.io/${REPO}:${TAG}"
            echo ""
            echo "# Helm"
            echo "helm install mcp-k8s oci://ghcr.io/${OWNER}/charts/mcp-k8s --version ${VERSION}"
            echo ""
            echo "# Claude Code (stdio)"
            echo "claude mcp add k8s -- /path/to/mcp-k8s"
            echo "\`\`\`"
            echo ""
            echo "## Stats"
            echo ""
            echo "- **${TOOL_COUNT}** MCP tools"
          } > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release_notes.md
          generate_release_notes: true
          append_body: true
