[package]
name = "mcp-k8s"
version = "0.6.0"
edition = "2021"
# MSRV for library consumers (kube 5 needs 1.95). CI checks the library build
# on it; the binary is built with rust-toolchain.toml.
rust-version = "1.95"
description = "Kubernetes MCP (Model Context Protocol) server and library"
license = "MIT"
publish = false

[[bin]]
name = "mcp-k8s"
path = "src/main.rs"
required-features = ["server"]

[lib]
name = "mcp_k8s"
path = "src/lib.rs"

[dependencies]
kube = { version = "5", features = ["ws"] }
# No version feature here: a library must not pick the Kubernetes API version,
# or it collides with the consumer's choice (two `v1_*` features are a compile
# error). The `server` feature below picks one for the binary, and the
# dev-dependency picks one for tests. See "Library Usage" in the README.
k8s-openapi = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time"] }
thiserror = "2"
http = "1"
# approve_csr parses the PKCS#10 request to check the identity it asks for.
# RustCrypto's x509-cert (pure Rust; der/spki/const-oid, no crypto) without its
# `pem` feature: `pem` is already in the graph through kube-client.
x509-cert = { version = "0.3", default-features = false }
pem = "4"
axum = { version = "0.8", optional = true }
futures = "0.3"
tower-http = { version = "0.7", features = ["cors", "timeout"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
utoipa = { version = "6", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "10", features = ["axum"], optional = true }
# ring is the only TLS provider (installed in main.rs); keep rustls's default
# aws-lc-rs provider out of the build.
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
subtle = { version = "2", optional = true }
# OpenTelemetry export, for the binary only (see the `otel` feature). The
# library emits plain `tracing` and must never depend on these: OTel's global
# providers are statics inside the `opentelemetry` crate, so an embedder on a
# different 0.x version would silently get no telemetry from us.
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", features = ["spec_unstable_metrics_views"], optional = true }
# OTLP over http/protobuf only (no `grpc-tonic`), with the blocking reqwest
# client the SDK's batch processors are designed for.
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs", "internal-logs"], optional = true }
opentelemetry-appender-tracing = { version = "0.33", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
# TLS for the OTLP exporter through rustls with *no* bundled crypto provider:
# reqwest's `rustls` feature would add aws-lc-rs, while `rustls-no-provider`
# uses the process-wide ring provider that main() installs at startup.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }

[features]
default = ["server"]
# Everything only the standalone HTTP server binary (src/main.rs) needs.
# Library users such as deckwatch should depend with `default-features = false`
# so they don't compile these, in particular utoipa-swagger-ui, whose build
# script downloads the Swagger UI bundle and unpacks it with the `zip` crate.
server = [
    # The binary picks the Kubernetes API version it compiles against: the
    # oldest one k8s-openapi 0.29 supports, so it runs against Kubernetes >= 1.33.
    "k8s-openapi/v1_33",
    "dep:axum",
    "dep:axum-server",
    "dep:clap",
    "dep:metrics-exporter-prometheus",
    "dep:rustls",
    "dep:subtle",
    "dep:tower-http",
    "dep:tracing-subscriber",
    "dep:utoipa",
    "dep:utoipa-swagger-ui",
    "dep:uuid",
    # Graceful shutdown on SIGTERM/SIGINT, so telemetry is flushed.
    "tokio/signal",
    "otel",
]
# The binary's OpenTelemetry pipeline (OTLP traces, metrics and logs), enabled
# by `server`. Library code never uses these crates; it only emits `tracing`
# (see `mcp_k8s::telemetry`).
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:reqwest",
]

[dev-dependencies]
# Tests (also `--no-default-features` ones) compile against Kubernetes 1.33 types.
k8s-openapi = { version = "0.29", features = ["v1_33"] }
# Unit tests capture metrics with the Prometheus recorder, also without `server`.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# The k3s integration tests install the rustls crypto provider for kube's client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Capturing `tracing` layer for the library telemetry tests (also without `server`).
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# In-memory span/metric/log exporters for the binary's telemetry tests.
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
# Router tests in src/main.rs (`oneshot`).
tower = { version = "0.5", features = ["util"] }
tower-test = "0.4"
tokio-test = "0.4"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["k3s"] }
tempfile = "3"
