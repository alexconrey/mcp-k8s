[package]
name = "mcp-k8s"
version = "0.1.0"
edition = "2021"
description = "Kubernetes MCP (Model Context Protocol) server and library"
license = "MIT"
publish = false

[[bin]]
name = "mcp-k8s"
path = "src/main.rs"

[lib]
name = "mcp_k8s"
path = "src/lib.rs"

[dependencies]
kube = { version = "4", features = ["ws"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync"] }
thiserror = "2"
http = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
