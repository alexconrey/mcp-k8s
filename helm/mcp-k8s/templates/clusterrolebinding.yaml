{{- if .Values.rbac.create -}}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
{{- end }}
metadata:
  name: {{ include "mcp-k8s.fullname" . }}
  labels:
    {{- include "mcp-k8s.labels" . | nindent 4 }}
roleRef:
  {{- if .Values.rbac.clusterWide }}
  kind: ClusterRole
  {{- else }}
  kind: Role
  {{- end }}
  name: {{ include "mcp-k8s.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-k8s.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
