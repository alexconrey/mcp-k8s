{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-k8s.fullname" . }}
  labels:
    {{- include "mcp-k8s.labels" . | nindent 4 }}
rules:
  {{- include "mcp-k8s.rbacRules" (dict "Values" .Values "clusterWide" true) | nindent 2 }}
{{- else }}
{{- range $ns := (.Values.namespaces | default (list .Release.Namespace)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mcp-k8s.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "mcp-k8s.labels" $ | nindent 4 }}
rules:
  {{- include "mcp-k8s.rbacRules" (dict "Values" $.Values "clusterWide" false) | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
