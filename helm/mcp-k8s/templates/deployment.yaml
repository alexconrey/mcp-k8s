apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-k8s.fullname" . }}
  labels:
    {{- include "mcp-k8s.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-k8s.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-k8s.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mcp-k8s.serviceAccountName" . }}
      containers:
        - name: mcp-k8s
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /mcp-k8s
            - --http
          env:
            {{- if .Values.namespaces }}
            - name: MCP_K8S_NAMESPACES
              value: {{ join "," .Values.namespaces | quote }}
            {{- end }}
            {{- if .Values.permissions.disableCreate }}
            - name: DISABLE_CREATE
              value: "true"
            {{- end }}
            {{- if .Values.permissions.disableUpdate }}
            - name: DISABLE_UPDATE
              value: "true"
            {{- end }}
            {{- if .Values.permissions.disableDelete }}
            - name: DISABLE_DELETE
              value: "true"
            {{- end }}
            {{- if .Values.permissions.disableActions }}
            - name: MCP_K8S_DISABLE
              value: {{ join "," .Values.permissions.disableActions | quote }}
            {{- end }}
            {{- with .Values.otel }}
            {{- if .endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            {{- if .serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .serviceName | quote }}
            {{- end }}
            {{- $attrs := list }}
            {{- if .clusterName }}
            {{- $attrs = append $attrs (printf "k8s.cluster.name=%s" .clusterName) }}
            {{- end }}
            {{- range $key, $value := .resourceAttributes }}
            {{- $attrs = append $attrs (printf "%s=%v" $key $value) }}
            {{- end }}
            {{- if $attrs }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ join "," $attrs | quote }}
            {{- end }}
            {{- if .sampler }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .sampler | quote }}
            {{- end }}
            {{- if .samplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .samplerArg | quote }}
            {{- end }}
            {{- if not .traces }}
            - name: OTEL_TRACES_EXPORTER
              value: "none"
            {{- end }}
            {{- if not .metrics }}
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            {{- end }}
            {{- if not .logs }}
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            {{- end }}
            {{- if and .headersSecret.name .headersSecret.key }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .headersSecret.name | quote }}
                  key: {{ .headersSecret.key | quote }}
            {{- end }}
            {{- if .filter }}
            - name: MCP_K8S_OTEL_FILTER
              value: {{ .filter | quote }}
            {{- end }}
            {{- end }}
            {{- with .extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
