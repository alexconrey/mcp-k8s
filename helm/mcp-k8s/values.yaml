image:
  repository: ghcr.io/alexconrey/mcp-k8s
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# List of namespaces to restrict to. Empty means all namespaces are allowed.
namespaces: []

permissions:
  disableCreate: false
  disableUpdate: false
  disableDelete: false
  # List of "resource-action" strings to disable (e.g. ["pods-delete", "secrets-create"])
  disableActions: []
  # Remove the apply_manifest tool (it enforces the same guardrails as the
  # typed tools either way).
  disableApplyManifest: false

# Extra environment variables for the mcp-k8s container, e.g. to relax a
# workload guardrail (see docs/src/permissions.md):
#   extraEnv:
#     - name: MCP_K8S_ALLOW_LOADBALANCER
#       value: "true"
#     - name: MCP_K8S_ALLOW_CUSTOM_RESOURCE_GROUPS
#       value: "cert-manager.io"
extraEnv: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

rbac:
  create: true
  # If true, creates ClusterRole/ClusterRoleBinding. If false, creates namespaced Role/RoleBinding.
  clusterWide: true

serviceAccount:
  create: true
  # If empty, the name is auto-generated using the fullname template.
  name: ""

ingress:
  enabled: false
  className: ""
  host: ""

pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: false
  # Restrict ingress to specific CIDRs
  allowedCIDRs: []
  # Restrict ingress to pods in specific namespaces
  allowedNamespaces: []
