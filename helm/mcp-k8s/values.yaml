image:
  repository: ghcr.io/alexconrey/mcp-k8s
  # Defaults to the chart's appVersion (v<appVersion>), the image released with
  # this chart. Set it to pin another release, or `main` for the latest build
  # of the main branch.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

# List of namespaces to restrict to. Empty means all namespaces are allowed.
namespaces: []

permissions:
  disableCreate: false
  disableUpdate: false
  disableDelete: false
  # List of "resource-action" strings to disable (e.g. ["pods-delete", "secrets-create"])
  disableActions: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

rbac:
  create: true
  # If true, creates ClusterRole/ClusterRoleBinding. If false, creates namespaced Role/RoleBinding.
  clusterWide: true

serviceAccount:
  create: true
  # If empty, the name is auto-generated using the fullname template.
  name: ""

ingress:
  enabled: false
  className: ""
  host: ""

pdb:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

networkPolicy:
  enabled: false
  # Restrict ingress to specific CIDRs
  allowedCIDRs: []
  # Restrict ingress to pods in specific namespaces
  allowedNamespaces: []

# OpenTelemetry export of traces, the mcp.server.operation.duration metric and
# logs, over OTLP http/protobuf. Off while `endpoint` is empty. Each value sets
# a standard OTEL_* variable; see the Telemetry page of the docs.
otel:
  # OTEL_EXPORTER_OTLP_ENDPOINT, e.g. http://otel-collector.observability:4318
  # (the http/protobuf port; gRPC is not supported).
  endpoint: ""
  # OTEL_SERVICE_NAME. The binary defaults to "mcp-k8s".
  serviceName: ""
  # Added to OTEL_RESOURCE_ATTRIBUTES as k8s.cluster.name: the name of the
  # cluster this release runs in (spans carry it only with --contexts).
  clusterName: ""
  # More OTEL_RESOURCE_ATTRIBUTES, e.g. {deployment.environment.name: prod}.
  resourceAttributes: {}
  # OTEL_TRACES_SAMPLER and OTEL_TRACES_SAMPLER_ARG, e.g.
  # parentbased_traceidratio and "0.25". The SDK default is parentbased_always_on.
  sampler: ""
  samplerArg: ""
  # false stops exporting a signal (OTEL_{TRACES,METRICS,LOGS}_EXPORTER=none).
  traces: true
  metrics: true
  logs: true
  # OTEL_EXPORTER_OTLP_HEADERS (e.g. "authorization=Bearer <token>") from a
  # Secret key, so credentials stay out of values.
  headersSecret:
    name: ""
    key: ""
  # MCP_K8S_OTEL_FILTER: tracing filter for exported spans and logs (default
  # "info"). DEBUG output of dependencies can contain request details.
  filter: ""
  # Other environment variables, e.g. OTEL_EXPORTER_OTLP_TIMEOUT or
  # OTEL_METRIC_EXPORT_INTERVAL. Rendered even without `endpoint`.
  extraEnv: []
