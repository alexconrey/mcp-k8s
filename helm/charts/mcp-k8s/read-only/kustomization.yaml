apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Read-only mode, the recommended starting point: the ClusterRole grants only
# get/list/watch (plus the self-review creates whoami/can_i need), and the
# server hides every write tool from tools/list.
resources:
  - ../base

patches:
  - path: clusterrole-patch.yaml
  - target:
      kind: Deployment
      name: mcp-k8s
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mcp-k8s
      spec:
        template:
          spec:
            containers:
              - name: mcp-k8s
                env:
                  - name: DISABLE_CREATE
                    value: "true"
                  - name: DISABLE_UPDATE
                    value: "true"
                  - name: DISABLE_DELETE
                    value: "true"
