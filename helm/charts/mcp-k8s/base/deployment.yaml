apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-k8s
  namespace: mcp-k8s
  labels:
    app.kubernetes.io/name: mcp-k8s
    app.kubernetes.io/part-of: mcp-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-k8s
        app.kubernetes.io/part-of: mcp-k8s
    spec:
      serviceAccountName: mcp-k8s
      # The server talks to the API server with its ServiceAccount token.
      automountServiceAccountToken: true
      # Scratch image, one static binary running as 65534 (nobody) that never
      # writes to disk.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-k8s
          image: ghcr.io/alexconrey/mcp-k8s:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command: ["/mcp-k8s", "--http"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MCP_K8S_LISTEN
              value: "0.0.0.0:8080"
            # Uncomment to disable mutating operations (or use the read-only/
            # overlay, which also narrows the ClusterRole):
            # - name: DISABLE_CREATE
            #   value: "true"
            # - name: DISABLE_UPDATE
            #   value: "true"
            # - name: DISABLE_DELETE
            #   value: "true"
            # Uncomment to restrict to specific namespaces (comma-separated):
            # - name: MCP_K8S_NAMESPACES
            #   value: "default,kube-system"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
